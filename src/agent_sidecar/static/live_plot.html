<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>agent live plot</title>
  <style>
    body { font-family: sans-serif; margin: 12px; background: #111; color: #eee; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .hint { font-size: 12px; color: #aaa; margin: 0 0 12px; max-width: 52rem; line-height: 1.45; }
    .chart { height: 250px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <h1>mpi-monitor overlay (submit host)</h1>
  <p class="hint">横轴：相对首个采样点的已运行时间（秒）。纵轴：该图指标，单位见图内轴标题。图例：主机 + MPI rank（如 cn1 r0）。</p>
  <p id="status">loading…</p>
  <div class="chart"><canvas id="cpu_pct"></canvas></div>
  <div class="chart"><canvas id="rss_mb"></canvas></div>
  <div class="chart"><canvas id="io_read_bps"></canvas></div>
  <div class="chart"><canvas id="io_write_bps"></canvas></div>
  <script src="/chart.umd.min.js"></script>
  <script>
    const METRICS = [
      ["cpu_pct", "CPU %", "CPU (%)", true],
      ["rss_mb", "RSS MB", "RSS (MB)", false],
      ["io_read_bps", "IO read B/s", "read (B/s)", true],
      ["io_write_bps", "IO write B/s", "write (B/s)", true],
    ];
    const charts = {};
    function colors(i) {
      const h = (i * 47) % 360;
      return "hsl(" + h + " 70% 55%)";
    }
    function ensureChart(metric, title, yLabel, yZero) {
      if (charts[metric]) return charts[metric];
      const ctx = document.getElementById(metric);
      charts[metric] = new Chart(ctx, {
        type: "line",
        data: { datasets: [] },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { left: 4, right: 8 } },
          plugins: { title: { display: true, text: title, color: "#eee" }, legend: { labels: { color: "#ddd" } } },
          scales: {
            x: {
              type: "linear",
              title: { display: true, text: "已运行时间 (s)", color: "#ccc", font: { size: 12 } },
              ticks: { color: "#aaa" },
            },
            y: {
              beginAtZero: yZero,
              title: { display: true, text: yLabel, color: "#ccc", font: { size: 12 } },
              ticks: { color: "#aaa" },
            },
          },
        },
      });
      return charts[metric];
    }
    function applySnapshot(snap) {
      METRICS.forEach(([metric, title, yLabel, yZero]) => {
        const chart = ensureChart(metric, title, yLabel, yZero);
        const series = (snap.metrics && snap.metrics[metric]) || [];
        chart.data.datasets = series.map((s, i) => ({
          label: s.label,
          data: (s.points || []).map((p) => ({ x: p[0], y: p[1] })),
          borderColor: colors(i),
          backgroundColor: colors(i),
          hidden: !s.visible,
          pointRadius: 0,
          borderWidth: 1.5,
          tension: 0,
        }));
        chart.update();
      });
      document.getElementById("status").textContent =
        "cap " + (snap.visible_cap || "") + " · series " +
        ((snap.metrics && snap.metrics.cpu_pct && snap.metrics.cpu_pct.length) || 0);
    }
    async function tick() {
      try {
        const res = await fetch("/api/snapshot");
        applySnapshot(await res.json());
      } catch (err) {
        document.getElementById("status").textContent = String(err);
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
